events {
    worker_connections 1024;
}

http {
    upstream rate_limit_servers {
        # means 2 servers will be used for load balancing from port 8080
        server server1:8080;
        server server2:8080;
    }

    server {
        # Rate limiting server
        listen 8080;

        location / {
            proxy_pass http://rate_limit_servers;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}