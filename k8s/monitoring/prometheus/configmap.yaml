apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: ratelimitx
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ratelimitx
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            action: keep
            regex: ratelimitx
          - source_labels:
              - __meta_kubernetes_pod_container_name
            action: keep
            regex: ratelimitx
          - source_labels:
              - __meta_kubernetes_pod_container_port_number
            action: keep
            regex: "8080"
          - source_labels:
              - __meta_kubernetes_pod_ready
            action: keep
            regex: "true"
          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: instance
            action: replace
