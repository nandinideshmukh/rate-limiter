<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">RateLimitX Kubernetes architecture</title>
  <desc id="description">Local Kind architecture with ingress, two fixed Go application replicas, shared Redis, Prometheus scraping both pods, and Grafana. No autoscaler is currently configured.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#526579"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172b4d; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526579; }
      .heading { font-size: 18px; font-weight: 700; }
      .label { font-size: 15px; font-weight: 600; }
      .small { font-size: 13px; fill: #526579; }
      .box { stroke-width: 2; rx: 12; }
      .flow { fill: none; stroke: #526579; stroke-width: 2.5; marker-end: url(#arrow); }
      .scrape { fill: none; stroke: #138a72; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .fixed { fill: #fff4e5; stroke: #d97706; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f7f9fc"/>
  <text x="50" y="52" class="title">RateLimitX on Kubernetes (Kind)</text>
  <text x="50" y="80" class="subtitle">Current manifests: two fixed app replicas; no HPA / autoscaling configured</text>

  <rect x="28" y="105" width="1144" height="615" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="52" y="139" class="heading">Namespace: ratelimitx</text>

  <rect class="box" x="75" y="190" width="175" height="78" fill="#eaf2ff" stroke="#3b82f6"/>
  <text x="162" y="223" text-anchor="middle" class="label">Browser</text>
  <text x="162" y="246" text-anchor="middle" class="small">ratelimitx.local</text>

  <rect class="box" x="335" y="190" width="205" height="78" fill="#eaf2ff" stroke="#3b82f6"/>
  <text x="437" y="223" text-anchor="middle" class="label">Ingress Controller</text>
  <text x="437" y="246" text-anchor="middle" class="small">ingress-nginx</text>

  <rect class="box" x="625" y="190" width="205" height="78" fill="#eaf2ff" stroke="#3b82f6"/>
  <text x="727" y="223" text-anchor="middle" class="label">Ingress</text>
  <text x="727" y="246" text-anchor="middle" class="small">host route → service</text>

  <rect class="box" x="930" y="190" width="195" height="78" fill="#eaf2ff" stroke="#3b82f6"/>
  <text x="1027" y="223" text-anchor="middle" class="label">Service: ratelimitx</text>
  <text x="1027" y="246" text-anchor="middle" class="small">ClusterIP · port 8080</text>

  <path class="flow" d="M250 229 H325"/>
  <path class="flow" d="M540 229 H615"/>
  <path class="flow" d="M830 229 H920"/>

  <rect class="box" x="835" y="330" width="300" height="222" fill="#f1f8ff" stroke="#60a5fa"/>
  <text x="985" y="362" text-anchor="middle" class="heading">Go Deployment · replicas: 2</text>
  <rect class="box" x="860" y="390" width="250" height="58" fill="#e8f7ef" stroke="#22a06b"/>
  <text x="985" y="415" text-anchor="middle" class="label">App Pod 1</text>
  <text x="985" y="436" text-anchor="middle" class="small">frontend + API · :8080</text>
  <rect class="box" x="860" y="468" width="250" height="58" fill="#e8f7ef" stroke="#22a06b"/>
  <text x="985" y="493" text-anchor="middle" class="label">App Pod 2</text>
  <text x="985" y="514" text-anchor="middle" class="small">frontend + API · :8080</text>
  <path class="flow" d="M1027 268 V315"/>

  <rect class="box" x="445" y="408" width="230" height="90" fill="#fff1f0" stroke="#ef4444"/>
  <text x="560" y="444" text-anchor="middle" class="label">Redis Deployment</text>
  <text x="560" y="468" text-anchor="middle" class="small">1 replica · in-memory</text>
  <rect class="box" x="475" y="535" width="170" height="58" fill="#fff1f0" stroke="#ef4444"/>
  <text x="560" y="559" text-anchor="middle" class="label">Service: redis</text>
  <text x="560" y="580" text-anchor="middle" class="small">redis:6379</text>
  <path class="flow" d="M835 444 C770 444 760 453 685 453"/>
  <path class="flow" d="M560 498 V525"/>
  <text x="740" y="431" text-anchor="middle" class="small">shared rate-limit state</text>

  <rect class="fixed" x="70" y="574" width="300" height="83"/>
  <text x="220" y="606" text-anchor="middle" class="label">No autoscaling yet</text>
  <text x="220" y="630" text-anchor="middle" class="small">Replicas stay at 2; no HPA configured</text>

  <rect class="box" x="78" y="347" width="250" height="90" fill="#e9fbf5" stroke="#138a72"/>
  <text x="203" y="383" text-anchor="middle" class="label">Prometheus</text>
  <text x="203" y="407" text-anchor="middle" class="small">pod discovery · /metrics</text>
  <rect class="box" x="78" y="464" width="250" height="68" fill="#f3edff" stroke="#8b5cf6"/>
  <text x="203" y="493" text-anchor="middle" class="label">Grafana</text>
  <text x="203" y="515" text-anchor="middle" class="small">RateLimitX dashboard</text>
  <path class="scrape" d="M328 375 C520 315 740 335 855 408"/>
  <path class="scrape" d="M328 395 C535 390 715 435 855 487"/>
  <text x="582" y="334" text-anchor="middle" class="small" fill="#138a72">scrapes each ready app pod directly</text>
  <path class="flow" d="M203 437 V454"/>
  <text x="225" y="451" class="small">metrics</text>

  <text x="50" y="693" class="small">Local development diagram · Prometheus and Grafana are separate services; Redis has no persistence or HA.</text>
</svg>
