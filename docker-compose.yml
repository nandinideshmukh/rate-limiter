services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - ratelimitx
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  server1:
    image: ghcr.io/nandinideshmukh/rate-limiter:main
    restart: unless-stopped
    environment:
      PORT: "8080"
      REDIS_ADDR: redis:6379
      INSTANCE_ID: server1
    networks:
      - ratelimitx
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"

  server2:
    image: ghcr.io/nandinideshmukh/rate-limiter:main
    restart: unless-stopped
    environment:
      PORT: "8080"
      REDIS_ADDR: redis:6379
      INSTANCE_ID: server2
    networks:
      - ratelimitx
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8082:8080"
    
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - ratelimitx
    depends_on:
      - server1
      - server2

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ratelimitx
    depends_on:
      - server1
      - server2

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ratelimitx
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"

volumes:
  prometheus_data:
  grafana_data:

networks:
  ratelimitx:
